# Public reverse proxy for the school-origin Web console.
# Install as /etc/nginx/sites-enabled/pku.chenzijian.com on the project VPS
# (current public VPS: 45.59.102.64).
# Public users authenticate in the application login page. Keep the loopback
# reverse tunnel intact and never expose the origin APIs directly.
server {
    listen 80;
    listen [::]:80;
    server_name pku.chenzijian.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pku.chenzijian.com;

    # Certbot uses a separate lineage so bootstrap/self-signed material cannot
    # collide with the production certificate or renewal configuration.
    ssl_certificate /etc/letsencrypt/live/pku.chenzijian.com-real/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pku.chenzijian.com-real/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # Compress only text-like responses.  Authenticated JSON is never cached
    # by the VPS, but compression avoids spending tunnel bandwidth on catalog,
    # audit and task metadata responses.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml text/x-component;
    tcp_nodelay on;

    location / {
        proxy_pass http://127.0.0.1:13780;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        # Buffering releases the SSH tunnel promptly when a reviewer has a
        # slow client. Browser/PDF HTTP caching remains the client-side cache;
        # the VPS deliberately does not cache authenticated responses.
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 128k;
        proxy_cache off;
    }
}
